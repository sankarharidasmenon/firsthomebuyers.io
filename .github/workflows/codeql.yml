name: CodeQL

# Static Application Security Testing (SAST).
#
# PREREQUISITE — read before wondering why this fails:
#   * Public repository  → works with no setup.
#   * Private repository → requires GitHub Advanced Security. Enable at
#     Settings → Code security → "Code scanning". Without it this workflow
#     fails with "Advanced Security must be enabled for this repository".
#
# It is kept in its own workflow (rather than as a job in ci.yml) precisely so
# that a licensing failure here cannot block the CI quality gate. Do not add
# it to branch protection until you have confirmed a green run.
on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]
  schedule:
    # Mondays 08:00 UTC — catches newly-published queries without a code change.
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is broader than the default security-extended;
          # start here and narrow to `security-extended` if the noise is high.
          queries: security-and-quality

      # No manual build step: JavaScript/TypeScript is analysed from source,
      # so CodeQL does not need `next build` (which would also require the
      # Supabase environment variables).
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
